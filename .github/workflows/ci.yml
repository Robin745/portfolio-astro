name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, types, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Builds the production site, serves it, then runs smoke,
      # accessibility (axe, WCAG 2.2 AA), theme, navigation and CSP tests.
      - name: End-to-end tests
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
